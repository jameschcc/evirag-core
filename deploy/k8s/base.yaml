apiVersion: v1
kind: Namespace
metadata:
  name: knowledge-base
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-config
  namespace: knowledge-base
data:
  KB_ENVIRONMENT: kubernetes
  KB_MODEL_SERVICE_URL: http://model-service:8100
  KB_PIPELINE_REVISION: prototype-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: knowledge-base
spec:
  replicas: 2
  selector:
    matchLabels: {app: kb-api}
  template:
    metadata:
      labels: {app: kb-api}
    spec:
      containers:
        - name: api
          image: knowledge-base-api:prototype
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: kb-config}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: knowledge-base
spec:
  selector: {app: kb-api}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: knowledge-base
spec:
  replicas: 2
  selector:
    matchLabels: {app: kb-ingestion-worker}
  template:
    metadata:
      labels: {app: kb-ingestion-worker}
    spec:
      containers:
        - name: worker
          image: knowledge-base-api:prototype
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "kb.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
          envFrom:
            - configMapRef: {name: kb-config}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "4", memory: 4Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: knowledge-base
spec:
  replicas: 1
  selector:
    matchLabels: {app: kb-model-service}
  template:
    metadata:
      labels: {app: kb-model-service}
    spec:
      containers:
        - name: model-service
          image: knowledge-base-model:prototype
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
          readinessProbe:
            httpGet: {path: /health/ready, port: 8100}
          livenessProbe:
            httpGet: {path: /health/live, port: 8100}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: knowledge-base
spec:
  selector: {app: kb-model-service}
  ports:
    - port: 8100
      targetPort: 8100
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: knowledge-base
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: knowledge-base
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: kb-api}
