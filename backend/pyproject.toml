[project]
name = "offline-knowledge-base"
version = "0.1.0"
description = "Offline hybrid retrieval and grounded generation prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "elasticsearch>=8.15,<9",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]
[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
